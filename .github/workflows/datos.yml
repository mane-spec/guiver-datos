name: Paquete de datos semanal

on:
  schedule:
    # Sábado 05:17 UTC (06:17 Madrid en invierno), antes del orquestador
    - cron: "17 5 * * 6"
  workflow_dispatch:
    inputs:
      corte:
        description: "CORTE (AAAA-MM-DD). Vacío = último viernes"
        required: false

permissions:
  contents: write

jobs:
  datos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Selftest
        run: python3 datos.py --selftest
      - name: Descargar paquete
        run: |
          if [ -n "${{ github.event.inputs.corte }}" ]; then
            python3 datos.py --corte "${{ github.event.inputs.corte }}"
          else
            python3 datos.py
          fi
      - name: Guardar en el repo
        run: |
          git config user.name "guiver-datos-bot"
          git config user.email "actions@users.noreply.github.com"
          git add paquete/
          git commit -m "Paquete de datos $(date -u +%F)" || echo "sin cambios"
          git push
