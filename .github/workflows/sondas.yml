name: Sondas de fuentes (prueba)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sondas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 sondas.py
      - run: |
          mkdir -p diagnostico && mv sondas.json diagnostico/
          git config user.name "guiver-datos-bot"
          git config user.email "actions@users.noreply.github.com"
          git add diagnostico/ && git commit -m "Sondas $(date -u +%F)" && git push
