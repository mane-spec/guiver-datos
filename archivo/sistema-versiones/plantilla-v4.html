<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: nota de research en papel. Resumen → la semana (lista de días; un toque abre la explicación completa del día, sin más botones)
   → mecanismo (funding, Treasury, confirmación, tipos) → sesgos → cómo acertamos → informe completo. Móvil primero, una columna. */
:root{
  --paper:#F6F7F9; --sheet:#FFFFFF; --ink:#13203A; --ink-2:#3C4659; --mute:#667085; --rule:#DDE1E8; --rule-2:#C9CFD9;
  --accent:#2C47B8; --accent-soft:#EDF0FA;
  --off:#A9403A; --off-soft:#F7ECEB; --on:#2D7556; --on-soft:#E9F3EE; --neu:#B5BCC8; --warn:#8A5A00; --warn-soft:#FBF3E2;
  --serif:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --gut-l:max(16px,env(safe-area-inset-left,0px)); --gut-r:max(16px,env(safe-area-inset-right,0px));
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 var(--sans);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;text-wrap:balance;color:var(--ink)}
p{margin:0}
a{color:var(--accent)}
pre{white-space:pre-wrap;overflow-wrap:anywhere}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}
.wrap{max-width:860px;margin:0 auto;padding-left:var(--gut-l);padding-right:var(--gut-r)}

/* cabecera */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--sheet);border-bottom:1px solid var(--rule)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;min-height:56px}
.brand{font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;color:var(--accent);font-weight:500;white-space:nowrap}
.top-t{font-size:14px;color:var(--ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top nav{margin-left:auto;display:flex;gap:14px}
.top nav a{font-size:13.5px;color:var(--ink-2);text-decoration:none;white-space:nowrap}
@media (max-width:640px){.top nav{display:none}}

main{padding-block:28px 64px}
section{padding-block:28px;border-top:1px solid var(--rule)}
section:first-child{border-top:0;padding-top:4px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:8px}
h2{font-size:clamp(22px,4.6vw,27px);line-height:1.2;margin-bottom:6px}
.lede{color:var(--ink-2);max-width:65ch}
h3{font-size:17px;line-height:1.3;margin:22px 0 8px}

/* resumen */
.regime{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin:8px 0 14px}
.regime h1{font-size:clamp(30px,8vw,44px);line-height:1.05}
.badge{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:12px;font-size:12.5px;font-weight:500;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.off{background:var(--off-soft);color:var(--off)}
.badge.on{background:var(--on-soft);color:var(--on)}
.thesis{font-family:var(--serif);font-size:clamp(17px,4.2vw,19px);line-height:1.55;color:var(--ink);border-left:3px solid var(--accent);padding-left:14px;max-width:62ch}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);margin-top:20px}
@media (min-width:700px){.facts{grid-template-columns:repeat(4,minmax(0,1fr))}}
.fact{background:var(--sheet);padding:12px 14px;min-width:0}
.fact b{display:block;font-family:var(--mono);font-size:20px;font-weight:500;line-height:1.25}
.fact span{display:block;font-size:12.5px;color:var(--mute);line-height:1.35}
.md-inline ul{margin:6px 0 0;padding-left:20px}
.md-inline li{margin:6px 0;color:var(--ink-2);max-width:65ch}

/* la semana */
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--mute);margin:10px 0 14px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.days{display:flex;flex-direction:column;background:var(--sheet);border:1px solid var(--rule);border-radius:6px}
.day+.day{border-top:1px solid var(--rule)}
.dayrow{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;text-align:left;background:none;border:0;padding:14px 16px;cursor:pointer}
.dayrow:hover{background:var(--paper)}
.dname{font-weight:600;font-size:15.5px}
.dname small{font-weight:400;color:var(--mute);font-size:13.5px;margin-left:6px}
.dlean{font-size:13.5px;font-weight:500;white-space:nowrap;text-align:right}
.dlean.off{color:var(--off)} .dlean.on{color:var(--on)} .dlean.eq{color:var(--mute)}
.bar{grid-column:1/-1;display:flex;height:8px;border-radius:2px;overflow:hidden;background:var(--rule)}
.bar span{display:block;height:100%}
.bar .b-on{background:var(--on)} .bar .b-neu{background:var(--neu)} .bar .b-off{background:var(--off)}
.dsub{grid-column:1/-1;display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--mute)}
.dsub .num{color:var(--ink-2);white-space:nowrap}
.dsub .ev{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev{font-family:var(--mono);color:var(--mute);transition:transform .2s ease;display:inline-block;margin-left:6px}
.day.open .chev{transform:rotate(90deg)}
.detail{padding:4px 16px 20px;border-top:1px dashed var(--rule)}
.day.open .dayrow{background:var(--accent-soft)}
.probs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0 6px}
.probs div{border:1px solid var(--rule);border-radius:4px;padding:8px 10px}
.probs b{display:block;font-family:var(--mono);font-size:26px;font-weight:500;line-height:1.15}
.probs span{font-size:12.5px;color:var(--mute)}
.probs .p-on b{color:var(--on)} .probs .p-off b{color:var(--off)}
.verdict{font-family:var(--serif);font-size:18px;line-height:1.45;margin:14px 0 4px}
.dsec{margin-top:18px}
.dsec>h4{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:500;margin:0 0 8px}
.flist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.flist li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;font-size:14.5px;line-height:1.5}
.flist .pt{font-family:var(--mono);font-size:12.5px;padding:1px 6px;border-radius:3px;height:fit-content;white-space:nowrap}
.pt.off{background:var(--off-soft);color:var(--off)} .pt.on{background:var(--on-soft);color:var(--on)} .pt.two{background:var(--paper);color:var(--ink-2);border:1px solid var(--rule)}
.flist .d{display:block;color:var(--mute);font-size:13px;margin-top:2px}
.agenda{width:100%;border-collapse:collapse;font-size:14px}
.agenda td{padding:7px 0;border-top:1px solid var(--rule);vertical-align:top}
.agenda td:first-child{font-family:var(--mono);font-size:13px;white-space:nowrap;padding-right:12px;color:var(--ink-2);width:1%}
.agenda tr:first-child td{border-top:0}
.change{display:flex;flex-direction:column;gap:8px}
.change div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;font-size:14px;padding:9px 12px;background:var(--paper);border-radius:4px}
.change b{font-family:var(--mono);font-weight:500;white-space:nowrap}
.change .d{grid-column:1/-1;color:var(--mute);font-size:12.5px}
.calc{font-size:13px;color:var(--mute);line-height:1.55}
.calc .num{color:var(--ink-2)}
.note{font-size:13px;color:var(--mute);line-height:1.5;margin-top:10px;max-width:70ch}
.warnbox{background:var(--warn-soft);color:var(--warn);font-size:13.5px;padding:9px 12px;border-radius:4px;margin-top:12px}

/* tablas y gráficos */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:12px;border:1px solid var(--rule);border-radius:4px;background:var(--sheet)}
table.t{border-collapse:collapse;width:100%;font-size:14px}
table.t th,table.t td{padding:9px 12px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:top}
table.t th{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:500;background:var(--paper);white-space:nowrap}
table.t td.r,table.t th.r{text-align:right}
table.t td.num{font-size:13.5px;white-space:nowrap}
table.t tr:last-child td{border-bottom:0}
.sig{font-size:12.5px;font-weight:500;white-space:nowrap}
.sig.off{color:var(--off)} .sig.on{color:var(--on)} .sig.mix{color:var(--warn)} .sig.na{color:var(--mute)}
.chart{background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:12px 12px 6px;margin-top:12px}
.chart svg{display:block;width:100%;height:auto}
.chart text{font-family:var(--mono);font-size:11px;fill:var(--mute)}
.ckey{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--ink-2);margin-bottom:6px}
.ckey i{display:inline-block;width:12px;height:3px;margin-right:6px;vertical-align:3px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media (min-width:760px){.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0;font-size:14.5px;background:var(--sheet);border:1px solid var(--rule);border-radius:4px;margin-top:12px}
.kv>*{padding:9px 12px;border-top:1px solid var(--rule)}
.kv>:nth-child(1),.kv>:nth-child(2){border-top:0}
.kv .v{font-family:var(--mono);font-size:13.5px;text-align:right;white-space:nowrap}
.kv .s{grid-column:1/-1;font-size:12.5px;color:var(--mute);border-top:0;padding-top:0}

/* informe */
.md{max-width:70ch;font-size:15.5px;line-height:1.65;color:var(--ink-2)}
.md h1{font-size:24px;margin:0 0 4px}
.md h1+p{font-family:var(--mono);font-size:12.5px;color:var(--mute)}
.md h2{font-size:20px;margin:28px 0 8px}
.md h3{font-size:16px}
.md p,.md ul,.md ol{margin:8px 0}
.md ul,.md ol{padding-left:20px}
.md li{margin:4px 0}
.md strong{color:var(--ink)}
.md .tw{max-width:none}
.md table{border-collapse:collapse;width:100%;font-size:13.5px}
.md th,.md td{padding:8px 10px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:top;min-width:80px}
.md th{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:500;background:var(--paper)}
.md code{font-family:var(--mono);font-size:13px;background:var(--paper);padding:1px 4px;border-radius:3px}
.md pre{font-family:var(--mono);font-size:12px;background:var(--paper);padding:12px;border-radius:4px;overflow-x:auto;white-space:pre-wrap}
.annex{margin-top:28px;display:flex;flex-direction:column;gap:8px}
.annex details{background:var(--sheet);border:1px solid var(--rule);border-radius:4px}
.annex summary{cursor:pointer;padding:12px 14px;font-weight:500;list-style:none;display:flex;justify-content:space-between}
.annex summary::-webkit-details-marker{display:none}
.annex details[open] summary{border-bottom:1px solid var(--rule)}
.annex .md{padding:4px 14px 16px;max-width:none}
footer{border-top:1px solid var(--rule);padding-block:24px 40px;font-size:13px;color:var(--mute)}
footer b{font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;color:var(--accent);font-weight:500}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.chev{transition:none}}
@media print{.top,body::before{display:none}section{break-inside:avoid-page}}

<script>
const DATOS = /*__DATOS__*/null;

// MOTOR-INICIO — réplica exacta de motor.py v6.4 (catálogo inyectado desde motor.py)
const Motor = (cat) => {
  const PASO = cat.paso || 1;                                   // P-014: probabilidades exactas
  const CONF = cat.confirma_tension || ["move_110_135","move_gt_135","hy_ge_15","ccc_ge_40","fails_subiendo_sobre_media","xeurbi_le_m5_ampliando3","srf_material","tension_bancaria"];
  const red = (x, p) => Math.floor(x / p + 0.5) * p;
  const regla = (vals, tope) => { if (!vals.length) return 0; const v = [...vals].sort((a,b)=>b-a); return Math.min(v[0] + 0.5 * v.slice(1).reduce((s,x)=>s+x,0), tope); };
  function fondo(ids, porF, porM) {
    const tension = porF || porM, topeG = tension ? 4 : 1, topeOff = tension ? 6 : 2, topeOn = 2;
    const grupos = {}, traza = [];
    for (const id of ids) {
      const f = cat.fondo[id]; if (!f) continue;
      let pts = f.pts; if (f.grupo === "funding" && porF) pts *= 2;
      const k = f.grupo + "/" + f.lado; (grupos[k] = grupos[k] || []).push(pts);
      traza.push({id, grupo:f.grupo, lado:f.lado, pts});
    }
    const lado = {off:0, on:0}, porGrupo = {};
    for (const [k, v] of Object.entries(grupos)) { const g = regla(v, topeG); porGrupo[k] = g; lado[k.split("/")[1]] += g; }
    return {off: Math.min(lado.off, topeOff), on: Math.min(lado.on, topeOn), porGrupo, traza, antes: lado, topes:{grupo:topeG, off:topeOff, on:topeOn}};
  }
  const cumple = (cond, presion, sens) => cond == null ? true : cond === "funding" ? presion : (presion || sens);
  function dia(d, presion, sens) {
    const sub = []; let otros = 0, mega = 0;
    for (const e of d.dispersion) { const c = cat.dispersion[e.id]; if (!c) continue;
      if (e.id === "megacaps") mega = 1; else if (c.subasta) sub.push(c.pts); else otros += c.pts; }
    const disp = (sub.length ? regla(sub, 99) : 0) + otros + mega;
    let off = 0, on = 0; const traza = [];
    for (const e of d.direccion) { const c = cat.direccion[e.id]; if (!c) continue;
      if (!cumple(c.condicion, presion, !!sens)) { traza.push({id:e.id, pts:0, nota: c.condicion === "funding" ? "sin presión de funding" : "sin presión de funding ni sensibilidad a settlements"}); continue; }
      if (c.lado === "off") off += c.pts; else on += c.pts; traza.push({id:e.id, lado:c.lado, pts:c.pts}); }
    return {disp, off, on, traza};
  }
  function prob(pOff, pOn, tension, conf, base, paso = PASO) {
    const [bon, bneu, boff] = base.map(b => b / 100);
    const sOff = Math.log(boff / bneu) + 0.2 * pOff, sOn = Math.log(bon / bneu) + 0.2 * pOn;
    const den = 1 + Math.exp(sOn) + Math.exp(sOff);
    const modelo = [Math.exp(sOn)/den, 1/den, Math.exp(sOff)/den];
    const w = cat.pesos[conf][tension ? 1 : 0];
    const mez = modelo.map((m,i) => w*m + (1-w)*[bon,bneu,boff][i]);
    let techo = false;
    if (!tension) for (const i of [0,2]) if (mez[i] > 0.60) { mez[1] += mez[i] - 0.60; mez[i] = 0.60; techo = true; }
    let on = red(mez[0]*100, paso), off = red(mez[2]*100, paso), neu = 100 - on - off, suelo = false;
    if (!tension) while (neu < 20) { if (off >= on) off -= paso; else on -= paso; neu = 100 - on - off; suelo = true; }
    let empate = false;                                        // P-014: sin empates si el cálculo inclina
    if (on === off) { if (mez[0] > mez[2] + 1e-9) { on += paso; off -= paso; } else if (mez[2] > mez[0] + 1e-9) { off += paso; on -= paso; } else empate = true; }
    return {on, neu, off, sOff, sOn, modelo: modelo.map(x=>x*100), w, mez: mez.map(x=>x*100), techo, suelo, empate, paso};
  }
  const FUND_CAT = ["sofr_ge_iorb","gc_ge_iorb"], CAT_CAJA = ["settle_neto_absorcion20","fin_mes","fin_trimestre","tax_date"];
  function fondoDia(ids, d) {                                   // P-021: funding solo con catalizador de caja · P-022: festivo de bonos = base
    if (d.bonos_abierto === false) return [];
    if ((d.direccion || []).some(e => CAT_CAJA.includes(e.id))) return ids;
    return ids.filter(id => !FUND_CAT.includes(id));
  }
  function calcular(esc) {
    const presion = !!esc.porF;                                 // regla de presión de funding del usuario (puntúa)
    const porF = presion && (!!esc.forzar || esc.fondo.some(id => CONF.includes(id)));   // P-012: modo tensión con 2.ª capa
    const tension = porF || !!esc.porM;
    const fo = fondo(esc.fondo, porF, esc.porM);
    const dias = esc.dias.map(d => {
      const x = dia(d, presion, esc.sens);
      const conf = d.evento_verificado === false ? "baja" : esc.conf;
      const fd = fondo(fondoDia(esc.fondo, d), porF, esc.porM);                   // P-021 / P-022
      const pOff = x.disp + x.off + fd.off, pOn = x.disp + x.on + fd.on;
      return {fecha:d.fecha, dia:d.dia, ...x, fondoDia: fd, pOff, pOn, conf, tension, p: prob(pOff, pOn, tension, conf, esc.base)};
    });
    return {fondo: fo, dias, tension, presion, tensionPorFunding: porF, sinSegundaCapa: presion && !porF && !esc.porM};
  }
  return {calcular, prob, fondo, dia};
};
// MOTOR-FIN

    const f = new Intl.DateTimeFormat("en-US",{timeZone:"America/New_York",hour:"2-digit",minute:"2-digit",hourCycle:"h23"});
    for (let k = 0; k < 2; k++) { const [h,mm] = f.format(new Date(u)).split(":").map(Number); u += (min - (h*60+mm))*60000; }
    return new Intl.DateTimeFormat("es-ES",{timeZone:"Europe/Madrid",hour:"2-digit",minute:"2-digit"}).format(new Date(u)); } catch(e) { return null; } }

      <span>SRF (backstop de la Fed)</span><span class="v">${L(srf) ? num(L(srf).aceptado_bn,3) + " bn" : "—"}</span><span class="s">${esc(fc(L(srf)?.fecha))}</span>
      <span>ON RRP (colchón)</span><span class="v">${L(rrp) ? num(L(rrp).aceptado_bn,3) + " bn" : "—"}</span><span class="s">${esc(fc(L(rrp)?.fecha))} · casi vacío: cualquier drenaje sale de reservas</span>
      <span>Reservas bancarias</span><span class="v">${L(resv) ? num(L(resv).bn,1) + " bn" : "—"}</span><span class="s">${esc(fc(L(resv)?.fecha))}${resv.length > 1 ? " · " + sg(L(resv).bn - resv[resv.length-2].bn,1) + " bn en la semana" : ""}</span>
    </div>
    <div class="chart"><div class="ckey"><span><i style="background:var(--accent)"></i>SOFR − IORB</span><span><i style="background:var(--on)"></i>TGCR − IORB</span><span class="mute">pb, diario</span></div><div id="chF"></div></div>
  </div>
  ${(S.evidencia || []).length ? `<h3>¿Reacciona el repo cuando el Tesoro retira efectivo?</h3>
  <div class="tw"><table class="t"><thead><tr><th>Día</th><th class="r">Efectivo neto retirado</th><th class="r">Cambio SOFR</th><th class="r">Cambio TGCR</th><th>Reacción</th></tr></thead><tbody>
  ${S.evidencia.map(e => `<tr><td>${esc(fdia(e.fecha).slice(0,3) + " " + fc(e.fecha))}</td><td class="r num">${sg(e.nnc_neto_bn,1)} bn</td><td class="r num">${sg(e.d_sofr_pb,0)} pb</td><td class="r num">${sg(e.d_tgcr_pb,0)} pb</td><td>${e.subio === "no" ? "no subió" : "subió " + esc(e.subio.replace("≥","≥ "))}</td></tr>`).join("")}</tbody></table></div>
  <p class="note">${S.activa ? "Regla cumplida: al menos un día subió 2 pb o más." : "Regla no cumplida."} Es coincidencia en el día, no causalidad probada.</p>` : ""}
</section>

<section>
  <div class="eyebrow">Mecanismo · 2</div>
  <h2>Treasury: ¿quién absorbe la deuda?</h2>
  <p class="lede">Barra hacia arriba: ese día el Tesoro retira efectivo neto al liquidar deuda (emisión menos vencimientos y recompras). Hacia abajo: lo devuelve.</p>
  <div class="chart"><div class="ckey"><span><i style="background:var(--off)"></i>retira ≥ 20 bn</span><span><i style="background:var(--on)"></i>devuelve ≥ 20 bn</span><span><i style="background:var(--neu)"></i>pequeño</span><span class="mute">bn por día · semana revisada y objetivo</span></div><div id="chN"></div></div>
  <div class="kv">
    <span>Cuenta del Tesoro en la Fed (TGA)</span><span class="v">${L(tga) ? num(L(tga).cierre_bn,1) + " bn" : "—"}</span><span class="s">${esc(fc(L(tga)?.fecha))}${ok(d2.tga_delta_rev_bn) ? ` · ${sg(d2.tga_delta_rev_bn,1)} bn en la semana revisada: ${d2.tga_delta_rev_bn < 0 ? "el Tesoro ha devuelto efectivo al sistema" : "el Tesoro ha retenido efectivo"}` : ""}</span>
    <span>Estado del plumbing</span><span class="v">${esc(d2.estado_plumbing || "—")}</span><span class="s">${d2.qra ? esc(`Refunding ${num(d2.qra.refunding_bn,0)} bn: liquida fuera de la semana. Próximo anuncio: ${fc(d2.qra.proximo_anuncio)}.`) : ""}</span>
  </div>
</section>

<section>
  <div class="eyebrow">Confirmación</div>
  <h2>Qué capas confirman el estrés</h2>
  <p class="lede">Para hablar de estrés no basta con el funding: hace falta que otras capas lo confirmen con dato actual.</p>
  <div class="tw"><table class="t"><thead><tr><th>Capa</th><th>Señal</th><th>Dato</th></tr></thead><tbody>
  ${(d3.capas || []).map(c => { const s = c.senal || ""; const k = /^CONFIRMA/.test(s) ? "off" : /^CONTRADICE/.test(s) ? "on" : /^MIXTA/.test(s) ? "mix" : "na";
    const t = {off:"confirma estrés", on:"contradice estrés", mix:"mixta", na: s ? s.toLowerCase() : "sin dato"}[k];
    return `<tr><td><b style="font-weight:600">${esc(c.capa)}</b></td><td><span class="sig ${k}">${esc(t)}</span></td><td>${esc(c.valor || "—")}<br><span class="mute" style="font-size:12.5px">${c.fecha ? esc(fc(c.fecha)) : "sin fecha"}${c.dato_actual === false ? " · dato atrasado o ausente" : ""}</span></td></tr>`; }).join("")}
  </tbody></table></div>
  ${d3.gli?.proxy_actual ? `<p class="note">Liquidez de bancos centrales (proxy G3, solo contexto): ${esc((d3.gli.proxy_actual.estado || "—").toLowerCase())}, antes ${esc((d3.gli.proxy_actual.estado_ant || "—").toLowerCase())}. No puntúa sin tu captura del GLI.</p>` : ""}
</section>

<section>
  <div class="eyebrow">Expectativas de tipos</div>
  <h2>Qué datos pueden mover los tipos</h2>
  ${(() => { const fw = d3.fedwatch || []; const stale = fw.some(f => f.estado === "STALE" || f.post_fomc === false);
    return `<p class="lede">${stale ? "La lectura de FedWatch disponible es antigua (anterior a la última reunión de la Fed): el sesgo de tipos no está confirmado y no puntúa." : "FedWatch se compara con la semana anterior."}</p>`; })()}
  <div class="tw"><table class="t"><thead><tr><th>Día</th><th>Dato</th><th>Consenso</th><th>Anterior</th><th>Sería hawkish si</th><th>Sería dovish si</th></tr></thead><tbody>
  ${MACRO.map(m => `<tr><td class="num">${esc(fdia(m.fecha).slice(0,3) + " " + fc(m.fecha))}<br><span class="mute">${esc(m.hora_et || "")} ET</span></td><td>${esc(m.evento)}</td><td>${esc(m.consenso || "—")}</td><td>${esc(m.anterior || "—")}</td><td>${esc(m.hawkish_si || "—")}</td><td>${esc(m.dovish_si || "—")}</td></tr>`).join("") || `<tr><td colspan="6">Sin datos de EE. UU. con consenso esta semana.</td></tr>`}
  </tbody></table></div>
</section>`;

const tb = seccion(FINAL, "Trading bias");
if (tb) H += `<section><div class="eyebrow">Ejecución</div><h2>Sesgos de trading</h2><p class="lede">Subordinados al diagnóstico de liquidez. Firme solo cuando el día supera el 50 % de risk-off con capas confirmadas.</p><div class="md" id="mdTb" style="max-width:none">${md(tb)}</div></section>`;

/* ---------------------------------------------------------------- aciertos */
const ev = D.evaluacion || {}, dr = ev.direccion;
const VER = {acierto:["acierto","on"], al_reves:["al revés","off"], neutral:["día neutral","na"], nc:["pendiente","na"], sin_direccion:["sin dirección","na"]};
const acum = (() => { let a = 0, m = 0; ((D.historial || {}).semanas || []).forEach(s => { const r = s.direccion_rev?.recuento; if (r) { a += r.acierto || 0; m += (r.acierto || 0) + (r.al_reves || 0); } }); return {a, m}; })();
H += `
<section id="aciertos">
  <div class="eyebrow">Control de calidad</div>
  <h2>¿Acertamos la semana pasada?</h2>
  <p class="lede">Lo que dijimos es el lado (risk-on o risk-off) que iba por delante cada día. Los días neutrales no cuentan como acierto ni como fallo.</p>
  ${dr?.dias?.length ? `<div class="tw"><table class="t"><thead><tr><th>Día</th><th class="r">Emitido on / neu / off</th><th>Dijimos</th><th>Pasó</th><th>Veredicto</th></tr></thead><tbody>
  ${dr.dias.map(x => { const v = VER[x.veredicto] || [x.veredicto,"na"]; const R = {on:"risk-on", off:"risk-off", neu:"neutral", nc:"pendiente"};
    return `<tr><td>${esc(fdia(x.fecha).slice(0,3) + " " + fc(x.fecha))}</td><td class="r num">${x.prob.on} / ${x.prob.neu} / ${x.prob.off}</td><td>${x.dijimos === "eq" ? "—" : esc(R[x.dijimos])} <span class="mute">(+${x.margen_pts})</span></td><td>${esc(R[x.resultado] || x.resultado)}</td><td><span class="sig ${v[1]}">${esc(v[0])}</span>${x.manual?.brier_motor != null ? `<br><span class="mute" style="font-size:12.5px">ajuste manual: ${x.manual.brier_publicado > x.manual.brier_motor ? "peor" : "mejor"} que el motor</span>` : ""}</td></tr>`; }).join("")}
  </tbody></table></div>` : `<p class="note">Sin evaluación de la semana anterior.</p>`}
  <div class="kv">
    <span>Dirección acertada la semana pasada</span><span class="v">${dr?.dias_con_movimiento ? `${dr.recuento.acierto} de ${dr.dias_con_movimiento}` : "—"}</span><span class="s">días con movimiento claro</span>
    <span>Dirección acertada acumulada</span><span class="v">${acum.m ? `${acum.a} de ${acum.m}` : "—"}</span><span class="s">desde la primera semana registrada; hacen falta 10 días con movimiento para juzgarla</span>
    <span>Brier de la semana (menor es mejor)</span><span class="v">${num(ev.brier_emitido,3)}</span><span class="s">base ${num(ev.brier_base,3)} · 30/40/30 ${num(ev.brier_304030,3)}</span>
  </div>
</section>`;

/* ---------------------------------------------------------------- informe */
const ANEX = [["parte1","Parte 1 · Funding y money markets"],["parte2","Parte 2 · Treasury plumbing"],["parte3","Parte 3 · Confirmación y probabilidades"],["auditoria","Auditoría de coherencia"]].filter(([k]) => inf[k]);
H += `
<section id="informe">
  <div class="eyebrow">Documento</div>
  <h2>Informe completo</h2>
  ${FINAL ? `<div class="md" id="mdFinal">${md(FINAL)}</div>` : `<p class="note">El informe final no está disponible.</p>`}
  ${ANEX.length ? `<div class="annex"><div class="eyebrow" style="margin-top:8px">Anexos con todo el detalle de fuentes y cálculos</div>${ANEX.map(([k,t]) => `<details><summary>${esc(t)}<span class="mute">abrir</span></summary><div class="md" data-k="${k}"></div></details>`).join("")}</div>` : ""}
</section>
<footer><b>GUIVER RESEARCH</b><p style="margin-top:8px;max-width:70ch">Probabilidades calculadas solo para la semana objetivo con el método ${esc(res.metodo || "v6")} y la información disponible al corte del ${esc(fc(d3.corte))}. Generado ${esc(D.generado || "—")}. No constituye recomendación de inversión.</p></footer>`;

app.innerHTML = H;
$$("#mdFinal, #mdTb, #resumen .md-inline").forEach(wrapTables);
$$(".annex details").forEach(d => d.addEventListener("toggle", () => { const b = $(".md", d); if (d.open && !b.dataset.done) { b.innerHTML = md(inf[b.dataset.k]); wrapTables(b); b.dataset.done = 1; } }));

/* un toque por día: abre la explicación completa (y cierra la anterior) */
function abrir(i, scroll){ $$(".day").forEach(d => { const on = d.id === "dia-" + i && !d.classList.contains("open");
  d.classList.toggle("open", on); $(".detail", d).hidden = !on; $(".dayrow", d).setAttribute("aria-expanded", on); });
  if (scroll) { const el = $("#dia-" + i); if (el && el.classList.contains("open")) el.scrollIntoView({block:"start", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"}); } }
$$(".dayrow").forEach(b => b.addEventListener("click", () => abrir(+b.dataset.i, true)));
if (masOff) abrir(masOff.i, false);

/* gráficos (SVG, escala única, colores del tema) */
function chartFunding(){
  const el = $("#chF"); if (!el) return; const t = (d1.tipos || []).filter(x => x.fecha);
  const sp = t.map(x => spread(x,"sofr")), gc = t.map(x => spread(x,"tgcr")); const v = [...sp, ...gc].filter(ok);
  if (!v.length) { el.innerHTML = `<p class="note">Sin serie.</p>`; return; }
  const lo = Math.min(-2, ...v) - 1, hi = Math.max(6, ...v) + 1, W = 400, Hh = 190, l = 30, r = 8, tp = 8, b = 160, n = t.length, bw = (W - l - r)/n;
  const x = i => l + bw*i + bw/2, y = val => tp + (hi - val)/(hi - lo)*(b - tp);
  let s = `<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="SOFR y TGCR menos IORB por día">`;
  for (let k = Math.ceil(lo/2)*2; k <= hi; k += 2) s += `<line x1="${l}" x2="${W-r}" y1="${y(k)}" y2="${y(k)}" stroke="var(--rule)" ${k === 0 ? 'stroke-width="1.5" stroke="var(--rule-2)"' : ""}/><text x="${l-5}" y="${y(k)+4}" text-anchor="end">${k > 0 ? "+" + k : k}</text>`;
  s += `<text x="${W-r}" y="${y(0)-4}" text-anchor="end">IORB</text>`;
  const ln = (a, c) => { let d = "", u = false; a.forEach((val,i) => { if (!ok(val)) { u = false; return; } d += (u ? "L" : "M") + x(i).toFixed(1) + " " + y(val).toFixed(1); u = true; }); return `<path d="${d}" fill="none" stroke="${c}" stroke-width="2"/>` + a.map((val,i) => ok(val) ? `<circle cx="${x(i)}" cy="${y(val)}" r="2.6" fill="${c}"/>` : "").join(""); };
  s += ln(gc, "var(--on)") + ln(sp, "var(--accent)");
  t.forEach((z,i) => { if (i % 2 === 0 || i === n-1) s += `<text x="${x(i)}" y="${Hh-10}" text-anchor="middle">${esc(fc(z.fecha))}</text>`; if (!ok(sp[i])) s += `<text x="${x(i)}" y="${y(0)-14}" text-anchor="middle">T+1</text>`; });
  el.innerHTML = s + "</svg>";
}
function chartNeto(){
  const el = $("#chN"); if (!el) return;
  const rows = [...(d2.neto_dia || []), ...(d2.neto_dia_sin_ledger || [])].filter(x => x.fecha).sort((a,b) => a.fecha < b.fecha ? -1 : 1);
  if (!rows.length) { el.innerHTML = `<p class="note">Sin flujo neto calculado.</p>`; return; }
  const W = 400, Hh = 210, l = 30, r = 8, tp = 22, b = 170, n = rows.length, bw = (W - l - r)/n;
  const mx = Math.max(20, ...rows.map(x => Math.abs(x.neto_bn || 0))) * 1.15, y = v => (tp + b)/2 - v/mx*(b - tp)/2, x = i => l + bw*i + bw/2;
  let s = `<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Efectivo neto retirado o devuelto por el Tesoro cada día">`;
  const oi = rows.map((z,i) => z.semana === "OBJ" ? i : null).filter(i => i !== null);
  if (oi.length) s += `<rect x="${x(oi[0]) - bw/2}" y="4" width="${bw*oi.length}" height="${b + 4}" fill="var(--accent-soft)"/><text x="${x(oi[0]) - bw/2 + 4}" y="15">semana objetivo</text>`;
  [-20, 0, 20].forEach(k => s += `<line x1="${l}" x2="${W-r}" y1="${y(k)}" y2="${y(k)}" stroke="${k ? "var(--rule)" : "var(--rule-2)"}" ${k ? 'stroke-dasharray="3 3"' : ""}/><text x="${l-5}" y="${y(k)+4}" text-anchor="end">${k > 0 ? "+" + k : k}</text>`);
  rows.forEach((z,i) => { const v = z.neto_bn; s += `<text x="${x(i)}" y="${Hh-8}" text-anchor="middle">${esc(fc(z.fecha).replace(" "," "))}</text>`;
    if (!ok(v)) { s += `<text x="${x(i)}" y="${y(0)-6}" text-anchor="middle">cerrado</text>`; return; }
    const top = Math.min(y(v), y(0)), h = Math.max(1.5, Math.abs(y(v) - y(0)));
    s += `<rect x="${x(i) - bw*.3}" y="${top}" width="${bw*.6}" height="${h}" fill="${v >= 20 ? "var(--off)" : v <= -20 ? "var(--on)" : "var(--neu)"}"/><text x="${x(i)}" y="${v >= 0 ? top - 4 : top + h + 12}" text-anchor="middle" style="fill:var(--ink-2)">${sg(v,0)}</text>`; });
  el.innerHTML = s + "</svg>";
}
chartFunding(); chartNeto();
})();
</script>
