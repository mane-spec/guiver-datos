<style>
/* Layout: previsión semanal, como una app del tiempo. Nivel 1: la semana en una frase y una tira de 5 días.
   Nivel 2: un toque en un día → qué puede pasar, por qué, qué lo amplifica, qué lo cambiaría y a qué hora.
   Contexto (qué ha cambiado) y aciertos. Nivel 3, plegado al final: datos técnicos e informe completo. Móvil primero. */
:root{
  --paper:#F5F6F8; --sheet:#FFFFFF; --ink:#14203A; --ink-2:#3D475A; --mute:#6A7385; --rule:#E0E4EA; --rule-2:#CBD1DB;
  --accent:#2C47B8; --accent-soft:#EEF1FA;
  --risk:#A9403A; --risk-soft:#F8ECEA; --watch:#8A5A00; --watch-soft:#FBF3E2; --calm:#5D6678; --calm-soft:#EEF0F3; --up:#2D7556; --up-soft:#E8F3EE;
  --b-on:#2D7556; --b-neu:#C3C9D3; --b-off:#A9403A;
  --serif:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --gut-l:max(16px,env(safe-area-inset-left,0px)); --gut-r:max(16px,env(safe-area-inset-right,0px));
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:64px}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 var(--sans);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;text-wrap:balance;color:var(--ink)}
p{margin:0}
pre{white-space:pre-wrap;overflow-wrap:anywhere}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}
.score{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 4px}.score div{border:1px solid var(--rule);border-radius:10px;padding:10px 12px;background:var(--sheet)}.score b{display:block;font-size:22px;color:var(--ink)}.score span{font-size:13px;color:var(--mute)}
.wrap{max-width:760px;margin:0 auto;padding-left:var(--gut-l);padding-right:var(--gut-r)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--sheet);border-bottom:1px solid var(--rule)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-block:12px}
.brand{font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;color:var(--accent);font-weight:500;white-space:nowrap}
.top-t{font-size:14px;color:var(--ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

main{padding-block:22px 56px;display:flex;flex-direction:column;gap:26px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:8px}
h2{font-size:21px;line-height:1.25;margin-bottom:10px}

/* nivel 1 */
.hero h1{font-size:clamp(27px,7.4vw,38px);line-height:1.12}
.hero .sub{margin-top:10px;font-size:17px;line-height:1.5;color:var(--ink-2);max-width:60ch}
.hero .meta{margin-top:10px;font-size:13px;color:var(--mute)}

.strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:18px}
.dbtn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 2px 9px;border-radius:8px;border:1px solid var(--rule);background:var(--sheet);cursor:pointer;min-width:0;transition:border-color .15s,box-shadow .15s}
.dbtn .dw{font-size:13px;font-weight:600;text-transform:capitalize}
.dbtn .dd{font-size:11.5px;color:var(--mute);margin-top:-3px}
.dbtn .lv{font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:10px;white-space:nowrap}
.dbtn .pc{font-family:var(--mono);font-size:16px;font-weight:500;line-height:1.1}
.dbtn .pl{font-size:10.5px;color:var(--mute);line-height:1.1}
.dbtn[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.lv.riesgo{background:var(--risk-soft);color:var(--risk)} .lv.vigilar{background:var(--watch-soft);color:var(--watch)}
.lv.tranquilo,.lv.festivo{background:var(--calm-soft);color:var(--calm)} .lv.apoyo{background:var(--up-soft);color:var(--up)}
.pc.riesgo{color:var(--risk)} .pc.vigilar{color:var(--watch)}
.strip-note{font-size:12.5px;color:var(--mute);margin-top:8px}

/* nivel 2: el día */
.day{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:18px 16px 20px}
.day-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px}
.day-h h2{margin:0}
.day-h .lv{font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:10px}
.pbar{display:flex;height:10px;border-radius:3px;overflow:hidden;margin-top:14px;background:var(--rule)}
.pbar span{display:block;height:100%}
.pkey{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px;font-size:12.5px;color:var(--mute)}

.pkey .k-off b{color:var(--risk)} .pkey .k-on b{color:var(--up)}
.pkey div:nth-child(2){text-align:center} .pkey div:nth-child(3){text-align:right}

.blk p,.blk li{font-size:16px;line-height:1.55;color:var(--ink)}
.blk ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.blk .lead{font-family:var(--serif);font-size:18px;line-height:1.45}
.agenda{list-style:none;padding:0!important;gap:0!important}
.agenda li{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px solid var(--rule)}
.agenda li:first-child{border-top:0}
.agenda .h{font-family:var(--mono);font-size:14px;color:var(--ink-2)}
.chg{display:flex;flex-direction:column;gap:6px;padding:0!important;list-style:none}
.chg li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:10px 12px;background:var(--paper);border-radius:6px;font-size:15px!important}

.st.bad{color:var(--risk)} .st.warn{color:var(--watch)} .st.good{color:var(--up)} .st.neu{color:var(--calm)}

.hit .dw{font-size:12.5px;font-weight:600;text-transform:capitalize}
.hit .v{font-size:12px;font-weight:600;margin-top:4px}
.hit .s{font-size:11px;color:var(--mute);line-height:1.3;margin-top:2px}
.v.ok{color:var(--up)} .v.ko{color:var(--risk)} .v.na{color:var(--mute)}
.note{font-size:13.5px;color:var(--mute);line-height:1.5;margin-top:10px}

/* nivel 3 */
.expert details{background:var(--sheet);border:1px solid var(--rule);border-radius:8px}
.expert details+details{margin-top:8px}
.expert summary{cursor:pointer;padding:14px 16px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:12px}
.expert summary::-webkit-details-marker{display:none}
.expert summary span{font-weight:400;color:var(--mute);font-size:14px}
.expert details[open] summary{border-bottom:1px solid var(--rule)}
.xb{padding:6px 16px 18px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:10px;border:1px solid var(--rule);border-radius:6px}
table.t{border-collapse:collapse;width:100%;font-size:13.5px}
table.t th,table.t td{padding:8px 10px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:top}
table.t th{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:500;background:var(--paper);white-space:nowrap}
table.t tr:last-child td{border-bottom:0}
table.t td.num{white-space:nowrap}
.chart{margin-top:12px}
.chart svg{display:block;width:100%;height:auto}
.chart text{font-family:var(--mono);font-size:11px;fill:var(--mute)}
.ckey{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--ink-2);margin-top:12px}
.ckey i{display:inline-block;width:12px;height:3px;margin-right:6px;vertical-align:3px}
.md{font-size:15px;line-height:1.62;color:var(--ink-2)}

.md h2{font-size:18px;margin:24px 0 6px} .md h3{font-size:15.5px}
.md p,.md ul,.md ol{margin:8px 0} .md ul,.md ol{padding-left:20px} .md strong{color:var(--ink)}
.md table{border-collapse:collapse;width:100%;font-size:13px}
.md th,.md td{padding:7px 9px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:top;min-width:80px}
.md th{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:500;background:var(--paper)}

.md pre{font-family:var(--mono);font-size:12px;background:var(--paper);padding:12px;border-radius:4px;overflow-x:auto}
footer{border-top:1px solid var(--rule);padding-block:20px 36px;font-size:12.5px;color:var(--mute)}
@media (min-width:640px){.dbtn{padding:12px 4px 11px}.dbtn .pc{font-size:18px}.day{padding:22px 24px 24px}}
@media (hover:hover){.dbtn:hover{border-color:var(--rule-2)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  const cumple = (cond, presion, sens) => cond == null ? true : cond === "funding" ? presion : (presion || sens);

  function calcular(esc) {
    const presion = !!esc.porF;                                 // regla de presión de funding del usuario (puntúa)

    const tension = porF || !!esc.porM;

    <div class="tw"><table class="t"><thead><tr><th>Capa</th><th>Señal</th><th>Dato</th></tr></thead><tbody>${(d3.capas || []).map(c => `<tr><td>${esc(c.capa)}</td><td>${esc((c.senal || "—").toLowerCase())}</td><td>${esc(c.valor || "—")} <span class="mute">${c.fecha ? esc(fc(c.fecha)) : ""}</span></td></tr>`).join("")}</tbody></table></div>
    <div class="tw"><table class="t"><thead><tr><th>Día</th><th>Puntos off / on</th><th>Fondo que cuenta</th><th>Prob.</th></tr></thead><tbody>${dias.map(x => `<tr><td>${esc(dw(x.r.fecha))} ${pd(x.r.fecha)?.d}</td><td class="num">${num(x.r.pts_off,1)} / ${num(x.r.pts_on,1)}</td><td>${esc((x.r.fondo_traza || []).map(z => z.id).join(", ") || "ninguno")}</td><td class="num">${x.p.on} / ${x.p.neu} / ${x.p.off}</td></tr>`).join("")}</tbody></table></div>
  </div></details>
  ${tb ? `<details><summary>Sesgos de trading <span>por activo</span></summary><div class="xb md" id="mdTb">${md(tb)}</div></details>` : ""}
  ${FINAL ? `<details><summary>Informe completo <span>documento de la semana</span></summary><div class="xb md" id="mdFinal"></div></details>` : ""}
  ${ANEX.map(([k,t]) => `<details><summary>${esc(t)} <span>anexo</span></summary><div class="xb md" data-k="${k}"></div></details>`).join("")}
</section>
<footer>Guiver Research · Probabilidades calculadas solo para la semana objetivo con el método ${esc(res.metodo || "v6")} y la información disponible al corte del ${esc(fc(d3.corte))}. No es una recomendación de inversión.</footer>`;
app.innerHTML = H;
wrapTables($("#mdTb") || document.createElement("div"));
$$(".expert details").forEach(d => d.addEventListener("toggle", () => { const b = $(".md[data-k], #mdFinal", d); if (d.open && b && !b.dataset.done) { b.innerHTML = md(b.id === "mdFinal" ? FINAL : inf[b.dataset.k]); wrapTables(b); b.dataset.done = 1; } if (d.open) { chartFunding(); chartNeto(); } }));

/* el día seleccionado */
function pintarDia(i){
  const x = dias[i]; if (!x) return;
  $$(".dbtn").forEach(b => b.setAttribute("aria-pressed", +b.dataset.i === i));
  const A = amplifica(x), C = cambiaria(x), G = agenda(x);
  $("#dia").innerHTML = `<article class="day">
    <div class="day-h"><h2>${esc(cap(fdl(x.r.fecha)))}</h2><span class="lv ${x.nivel}">${esc(NIVEL[x.nivel])}</span></div>
    <div class="pbar" aria-hidden="true"><span style="width:${x.p.off}%;background:var(--b-off)"></span><span style="width:${x.p.neu}%;background:var(--b-neu)"></span><span style="width:${x.p.on}%;background:var(--b-on)"></span></div>
    <div class="pkey"><div class="k-off"><b>${x.p.off}%</b>caídas</div><div><b>${x.p.neu}%</b>normal</div><div class="k-on"><b>${x.p.on}%</b>subidas</div></div>
    <div class="blk"><h3>Qué puede pasar</h3><p class="lead">${esc(quePasa(x))}</p></div>
    <div class="blk"><h3>Por qué</h3><ul>${porQue(x).map(t => `<li>${t}</li>`).join("")}</ul></div>
    <div class="blk"><h3>Qué lo amplifica</h3>${A.out.length ? `<ul>${A.out.map(t => `<li>${esc(t)}</li>`).join("")}</ul>` : `<p>Nada lo amplifica ese día.</p>`}${A.contra.length ? `<p class="note">A favor: ${esc(A.contra.join(" "))}</p>` : ""}</div>
    ${C.length ? `<div class="blk"><h3>Qué lo cambiaría</h3><ul class="chg">${C.map(z => `<li><span>${z.t}</span><b class="${z.v > x.p.off ? "up" : "dn"}">${z.v} % caídas</b></li>`).join("")}</ul></div>` : ""}
    <div class="blk"><h3>A qué hora (Madrid)</h3>${G.length ? `<ul class="agenda">${G.map(z => `<li><span class="h">${esc(z.h || "día")}</span><span>${esc(z.t)}</span></li>`).join("")}</ul>` : `<p>Sin eventos destacados.</p>`}</div>
  </article>`;
}
$$(".dbtn").forEach(b => b.addEventListener("click", () => { pintarDia(+b.dataset.i); const el = $("#dia"); if (el.getBoundingClientRect().top > innerHeight * .6) el.scrollIntoView({block:"start", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"}); }));
pintarDia(top ? top.i : 0);

/* gráficos del nivel técnico */
function chartFunding(){
  const el = $("#chF"); if (!el || el.dataset.done) return; const t = (d1.tipos || []).filter(x => x.fecha);
  const sp = t.map(x => ok(x.sofr) && ok(x.iorb) ? spr(x) : null), gc = t.map(x => ok(x.tgcr) && ok(x.iorb) ? Math.round((x.tgcr - x.iorb)*1000)/10 : null); const v = [...sp, ...gc].filter(ok);
  if (!v.length) return; el.dataset.done = 1;
  const lo = Math.min(-2, ...v) - 1, hi = Math.max(6, ...v) + 1, W = 400, Hh = 180, l = 30, r = 8, tp = 8, b = 150, n = t.length, bw = (W - l - r)/n;
  const x = i => l + bw*i + bw/2, y = val => tp + (hi - val)/(hi - lo)*(b - tp);
  let s = `<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="SOFR y TGCR menos IORB">`;
  for (let k = Math.ceil(lo/2)*2; k <= hi; k += 2) s += `<line x1="${l}" x2="${W-r}" y1="${y(k)}" y2="${y(k)}" stroke="${k === 0 ? "var(--rule-2)" : "var(--rule)"}"/><text x="${l-5}" y="${y(k)+4}" text-anchor="end">${k > 0 ? "+" + k : k}</text>`;
  const ln = (a, c) => { let d = "", u = false; a.forEach((val,i) => { if (!ok(val)) { u = false; return; } d += (u ? "L" : "M") + x(i).toFixed(1) + " " + y(val).toFixed(1); u = true; }); return `<path d="${d}" fill="none" stroke="${c}" stroke-width="2"/>`; };
  s += ln(gc, "var(--up)") + ln(sp, "var(--accent)");
  t.forEach((z,i) => { if (i % 2 === 0 || i === n-1) s += `<text x="${x(i)}" y="${Hh-6}" text-anchor="middle">${esc(fc(z.fecha))}</text>`; });
  el.innerHTML = s + "</svg>";
}
function chartNeto(){
  const el = $("#chN"); if (!el || el.dataset.done) return;
  const rows = [...(d2.neto_dia || []), ...(d2.neto_dia_sin_ledger || [])].filter(x => x.fecha).sort((a,b) => a.fecha < b.fecha ? -1 : 1);
  if (!rows.length) return; el.dataset.done = 1;
  const W = 400, Hh = 200, l = 30, r = 8, tp = 14, b = 166, n = rows.length, bw = (W - l - r)/n;
  const mx = Math.max(20, ...rows.map(x => Math.abs(x.neto_bn || 0))) * 1.15, y = v => (tp + b)/2 - v/mx*(b - tp)/2, x = i => l + bw*i + bw/2;
  let s = `<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Flujo neto diario del Tesoro">`;
  [-20, 0, 20].forEach(k => s += `<line x1="${l}" x2="${W-r}" y1="${y(k)}" y2="${y(k)}" stroke="${k ? "var(--rule)" : "var(--rule-2)"}"/><text x="${l-5}" y="${y(k)+4}" text-anchor="end">${k > 0 ? "+" + k : k}</text>`);
  rows.forEach((z,i) => { const v = z.neto_bn; s += `<text x="${x(i)}" y="${Hh-6}" text-anchor="middle">${esc(String(pd(z.fecha)?.d))}</text>`;
    if (!ok(v)) return; const t0 = Math.min(y(v), y(0)), h = Math.max(1.5, Math.abs(y(v) - y(0)));
    s += `<rect x="${x(i) - bw*.3}" y="${t0}" width="${bw*.6}" height="${h}" fill="${v >= 20 ? "var(--risk)" : v <= -20 ? "var(--up)" : "var(--b-neu)"}"/>`; });
  el.innerHTML = s + "</svg>";
}
})();
</script>
